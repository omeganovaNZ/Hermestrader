name: tests

on:
  push:
    branches: [main, README-revamp]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run pure-rule tests
        run: |
          for t in \
            tests/test_account_registry.py \
            tests/test_cap_trim_guard.py \
            tests/test_ladder_state_persistence.py \
            tests/test_portfolio_rules.py \
            tests/test_position_sizing.py \
            tests/test_profit_trim.py ; do
            echo "=== $t ==="
            python "$t" || exit 1
          done